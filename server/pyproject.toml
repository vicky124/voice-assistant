[project]
name = "voice-assistant-server"
version = "0.1.0"
description = "Streaming voice assistant backend: STT -> Claude -> sentence-level TTS over WebSockets"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.11,<2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "websockets>=13",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["voice*"]
